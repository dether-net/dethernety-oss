    statement: """
    MATCH (this)-[:HAS_ISSUE]-(e)
    OPTIONAL MATCH (e)-[:CONTAINS|BELONGS_TO|FLOWS|HANDLES|HAS_EXPOSURE|ANALYZED_BY*1..10]-(m:Model)
    OPTIONAL MATCH (e)<-[:HAS_EXPOSURE]-(c)
    RETURN DISTINCT {
      id: e.id,
      name: e.name,
      description: e.description,
      type: COALESCE(e.type, labels(e)[0]),
      element_type: labels(e)[0],
      category: COALESCE(e.category, ''),
      model_id: CASE WHEN 'Model' IN labels(e) THEN e.id ELSE m.id END,
      model_name: CASE WHEN 'Model' IN labels(e) THEN e.name ELSE m.name END,
      model_description: CASE WHEN 'Model' IN labels(e) THEN e.description ELSE m.description END,
      exposed_component_id: COALESCE(c.id, ''),
      exposed_component_name: COALESCE(c.name, ''),
      exposed_component_description: COALESCE(c.description, '')
    } AS issueElement
    """
    columnName: "issueElement"
  )
}

"""An issue class definition provided by a module."""
type IssueClass implements Element @authentication @node {
  "Unique identifier"
  id: ID! @id
  "Class name"
  name: String!
  "Module that provides this class"
  module: [Module!]! @relationship(type: "HAS_CLASS", direction: IN)
  "Free-text description"
  description: String
  "Issue type"
  type: String
  "Issue category"
  category: String
  "Configuration template (resolved at runtime)"
  template: String @customResolver(requires: "id module { name }")
  "Issues that are instances of this class"
  issues: [Issue!]! @relationship(type: "IS_INSTANCE_OF", direction: IN)
  "Timestamp at which this class was last orphaned (HAS_CLASS → HAS_ORPHANED_CLASS rename). Null if never orphaned."
  orphanedAt: DateTime
  "Count of incoming :IS_INSTANCE_OF edges. Read by operators before invoking deleteOrphanedClass to decide cascade safety."
  incomingInstanceCount: Int!
    @cypher(
      statement: """
      MATCH (this)<-[r:IS_INSTANCE_OF]-()
      RETURN count(r) AS n
      """
      columnName: "n"
    )
  "Breakdown of incoming :IS_INSTANCE_OF edges by parent node label. Used by CascadeDeleteDialog to surface 'this includes user work (Analyses)' warnings via the parent-label rows."
  incomingInstancesByType: [TypeCount!]!
    @cypher(
      statement: """
      MATCH (this)<-[r:IS_INSTANCE_OF]-(n)
      WITH labels(n)[0] AS type, count(r) AS count
      RETURN { type: type, count: count } AS row
      """
      columnName: "row"
    )
}

"""Statistics returned after deleting a model."""
type DeletionStats @authentication @node {
  "Number of graph nodes deleted"
  nodesDeleted: Int!
  "Number of graph relationships deleted"
  relationshipsDeleted: Int!
}

"""An analysis session identifier."""
type Session {
  "Session ID for subscribing to analysis results via streamResponse"
  sessionId: ID!
}

"""Result of adding elements to an issue."""
type AddElementsToIssueResult {
  "Number of elements successfully added"
  elementsAdded: String!
}

# Deprecation marker for the auto-generated `createAnalyses` mutation.
# Every in-tree caller has migrated to `createAnalysisIdempotent`; the
# auto-generated mutation remains available for any external consumer
# during the transition window but emits a deprecation warning in
# introspection. The override uses `extend type Mutation` with the exact
# signature @neo4j/graphql 7.x auto-generates; the library propagates the
# `@deprecated` directive onto the existing auto-generated resolver
# (via its PROPAGATED_DIRECTIVES mechanism — no impact on resolver
# wiring). Removal or admin-gating is a future major-bump decision.
extend type Mutation {
  createAnalyses(input: [AnalysisCreateInput!]!): CreateAnalysesMutationResponse!
    @deprecated(reason: "Use createAnalysisIdempotent — `createAnalyses` uses `connect` directives that produce duplicate IS_INSTANCE_OF edges on re-run. Removal planned for the next major release.")
}

type Mutation {
  "Link one or more elements to an issue"
  addElementsToIssue(
    issueId: String!
    elementIds: [String!]!
  ): AddElementsToIssueResult!
    @cypher(
      statement: """
      MATCH (issue:Issue {id: $issueId})
      UNWIND $elementIds as elementId
      MATCH (element {id: elementId})
      WHERE any(label IN labels(element) WHERE label IN ['Model','Component','DataFlow','SecurityBoundary','Control','Data','Analysis','Exposure','Countermeasure'])
      MERGE (issue)<-[:HAS_ISSUE]-(element)
      RETURN DISTINCT {
        elementsAdded: size(collect(element))
      } AS result
      """
      columnName: "result"
    )
    @authentication

  "Remove an element from an issue"
  removeElementFromIssue(
    issueId: String!
    elementId: String!
  ): Boolean!
    @cypher(
      statement: """
      MATCH (issue:Issue {id: $issueId})<-[r:HAS_ISSUE]-(element {id: $elementId})
      WHERE any(label IN labels(element) WHERE label IN ['Model','Component','DataFlow','SecurityBoundary','Control','Data','Analysis','Exposure','Countermeasure'])
      DELETE r
      RETURN TRUE as result
      """
      columnName: "result"
    )
    @authentication

  """
  Idempotently create or update an Analysis bound to its element and AnalysisClass.
  MERGE-by-id throughout — re-runs produce no duplicate IS_INSTANCE_OF edges.
  Caller supplies a stable `id`; the schema-level UNIQUE constraint on
  Analysis.id backstops the MERGE-non-atomic edge case under concurrent execution.

  An Analysis is conceptually an instance of exactly one AnalysisClass — so the
  cypher defensively removes any pre-existing IS_INSTANCE_OF edges to other
  classes before the MERGE. Calling with a different `analysisClassId` for the
  same `id` rebinds (it does not accumulate edges to multiple classes).
  ANALYZED_BY bindings to other elements are NOT pruned: an Analysis can
  legitimately span multiple elements per the schema's `Analysis.element`
  list-cardinality field.
  """
  createAnalysisIdempotent(
    id: ID!
    name: String!
    description: String
    type: String
    category: String
    elementId: ID!
    analysisClassId: ID!
  ): Analysis
    @cypher(
      statement: """
      MERGE (a:Analysis {id: $id})
        ON CREATE SET a.name = $name, a.description = $description,
                      a.type = $type, a.category = $category,
                      a.createdAt = datetime()
        ON MATCH  SET a.name = $name, a.description = $description,
                      a.type = $type, a.category = $category
      WITH a
      OPTIONAL MATCH (a)-[stale:IS_INSTANCE_OF]->(otherC:AnalysisClass)
        WHERE otherC.id <> $analysisClassId
      DELETE stale
      WITH a
      OPTIONAL MATCH (e {id: $elementId})
        WHERE any(label IN labels(e) WHERE label IN ['Model','Component','DataFlow','SecurityBoundary','Control','Data','Exposure','Countermeasure'])
      FOREACH (_ IN CASE WHEN e IS NULL THEN [] ELSE [1] END |
        MERGE (e)-[:ANALYZED_BY]->(a))
      WITH a
      MATCH (c:AnalysisClass {id: $analysisClassId})
      MERGE (a)-[:IS_INSTANCE_OF]->(c)
      RETURN a
      """
      columnName: "a"
    )
    @authentication

  # Perf note: the polymorphic `MATCH (e {id: $elementId})` above is an
  # unlabeled MATCH + label filter — Memgraph's planner can't use a
  # per-label `id` index here, so this scans all nodes and filters. The
  # same shape exists in addElementsToIssue / removeElementFromIssue. A
  # consistent rewrite to per-label CALL/UNION branches across all three
  # @cypher mutations is tracked as a perf follow-up; the per-label `id`
  # indexes are in place to back that rewrite.

  """
  Set configuration attributes on a component's class instantiation
  relationship. Returns a structured result envelope: `success`
  is true on the attribute write succeeding; `staleFlippedCount` is the
  number of dispositioned exposures on the component whose
  `dispositionStale` flipped to true as a result of an attribute value
  change. Zero when no value change is detected
  (no-op save), or when the component has no dispositioned exposures.
  """
  setInstantiationAttributes(
    componentId: String!
    classId: String!
    attributes: JSON!
  ): SetInstantiationAttributesResult!
    @authentication

  """
  Atomically change the class or representedModel binding of an element.
  Enforces class XOR representedModel mutual exclusion. Cleans up
  class-derived exposures/countermeasures for any class being disconnected,
  preserves user-authored findings (createdBy = USER) unconditionally, and
  instantiates derived findings for newly-connected classes via the module
  SDK — all in a single executeWrite transaction.

  Result envelope carries structured errorCode for failure paths;
  targetBinding echoes the binding that landed; deltas summarise the
  transaction counts (deleted/instantiated derived; preserved custom).
  """
  changeElementBinding(
    elementId: ID!
    target: ElementBindingInput!
  ): ChangeElementBindingResult!
    @authentication

  """
  Author, modify, or re-affirm the disposition on an Exposure. Stamps
  dispositionedBy and dispositionedAt from the authenticated user / current
  time. Clears dispositionStale unconditionally — re-affirming a stale
  disposition is a successful dispose call with prior kind and (possibly
  edited) reason. If a disposition already exists, last-writer-wins.
  Mandatory fields: kind, reason (non-empty after trim).
  """
  disposeExposure(
    exposureId: ID!
    kind: DispositionKind!
    reason: String!
  ): DispositionMutationResult!
    @authentication

  """
  Clear the disposition from an Exposure. Nulls all five disposition fields
  in a single SET. Idempotent when no disposition exists.
  """
  clearDisposition(
    exposureId: ID!
  ): DispositionMutationResult!
    @authentication

  """
  Author, modify, or re-affirm the disposition on a Countermeasure. Validates
  kind ∈ {NOT_APPLICABLE, FALSE_POSITIVE, WAIVED} (SUPERSEDED accepted only from
  the Supersede orchestrator). Stamps dispositionedBy / dispositionedAt
  server-side. Clears dispositionStale unconditionally. Mandatory fields: kind,
  reason (non-empty after trim). Returns the shared DispositionMutationResult —
  the exposureId field carries the countermeasure id in this path.
  """
  disposeCountermeasure(
    countermeasureId: ID!
    kind: DispositionKind!
    reason: String!
  ): DispositionMutationResult!
    @authentication

  """Clear the disposition from a Countermeasure. Idempotent."""
  clearCountermeasureDisposition(
    countermeasureId: ID!
  ): DispositionMutationResult!
    @authentication

  "Reset a module, clearing its cached state and reloading from disk"
  resetModule(moduleId: ID!): Boolean!
    @authentication

  "Delete a model and all its contained elements (boundaries, components, data flows, exposures)"
  deleteModel(modelId: ID!): DeletionStats!
    @cypher(
      statement: """
      MATCH (model:Model {id: $modelId})-[:CONTAINS]->(defbound:SecurityBoundary)
      OPTIONAL MATCH (defbound)<-[:BELONGS_TO*0..]-(secbound:SecurityBoundary)
      OPTIONAL MATCH (secbound)<-[:BELONGS_TO]-(comp:Component)
      OPTIONAL MATCH (comp)-[:FLOWS]-(flow:DataFlow)
      OPTIONAL MATCH (comp)-[:HANDLES]->(compdat:Data)
      OPTIONAL MATCH (flow)-[:HANDLES]->(flowdat:Data)
      OPTIONAL MATCH (secbound)-[:HANDLES]->(bounddat:Data)
      OPTIONAL MATCH (comp)-[:HAS_EXPOSURE]->(excomp:Exposure)
      OPTIONAL MATCH (flow)-[:HAS_EXPOSURE]->(exflow:Exposure)
      OPTIONAL MATCH (secbound)-[:HAS_EXPOSURE]->(exbound:Exposure)
      OPTIONAL MATCH (compdat)-[:HAS_EXPOSURE]->(exdat:Exposure)
      OPTIONAL MATCH (flowdat)-[:HAS_EXPOSURE]->(exflowdat:Exposure)
      OPTIONAL MATCH (bounddat)-[:HAS_EXPOSURE]->(exbounddat:Exposure)
      // Collect all nodes into a single list
      WITH collect(model) + collect(defbound) + collect(secbound) 
          + collect(comp) + collect(flow) + collect(compdat) 
          + collect(flowdat) + collect(bounddat)
          + collect(excomp) + collect(exflow) + collect(exbound)
          + collect(exdat) + collect(exflowdat) as nodesToDelete

      // Remove null entries and get distinct nodes
      UNWIND nodesToDelete as n
      WITH collect(distinct n) as distinctNodes

      // Count relationships that will be deleted
      UNWIND distinctNodes as dn
      MATCH (dn)-[r]-()
      WITH distinctNodes, count(r) as relCount

      // Delete all nodes
      UNWIND distinctNodes as node
      DETACH DELETE node

      // Return stats
      RETURN DISTINCT { 
        nodesDeleted: size(distinctNodes), 
        relationshipsDeleted: relCount 
      } AS result
      """
      columnName: "result"
    )
    @authentication

  "Start an analysis run, returns a session ID for subscribing to results"
  runAnalysis(
    analysisId: String!
    additionalParams: JSON
  ): Session!
    @authentication

  "Start a chat session with an analysis agent"
  startChat(
    analysisId: String!
    userQuestion: String!
    additionalParams: JSON
  ): Session!
    @authentication

  "Resume a paused analysis with user input (human-in-the-loop)"
  resumeAnalysis(
    analysisId: String!
    userInput: String!
  ): Session!
    @authentication

  "Delete an analysis and its associated data"
  deleteAnalysis(
    analysisId: String!
  ): Boolean!
    @authentication

  "Re-embed all class nodes when the embedding model changes"
  reindexClassEmbeddings(moduleIds: [ID!], capacity: Int): ReindexResult!
    @authentication

  # ── Class-identity admin mutations ─────────────────────────────────────
  # All four require admin role at runtime — enforced inside the resolver
  # via requireAdmin(ctx) (see is-admin.ts). The schema directive is just
  # @authentication; the resolver-side gate is sufficient for this small
  # admin surface and avoids introducing a role-aware schema directive.

  """
  Admin: align the DB id of a (Module, *Class) pair to a new id.
  Mechanically equivalent to an audit-mode rebind — emits the same
  rebind event into the in-memory log so the operator-driven action
  appears in the same timeline as automatic rebinds.

  Recommended direction: pass the module-declared id as `newId` (the
  canonical workflow — module source is authoritative for class id).
  An operator may align the other way but then must also update the
  module source — for source-controlled modules that means a code change;
  for DtLgModule-derived classes that means renaming the underlying graph
  in the LangGraph runtime.

  Cross-module collision check refuses the migration if `newId` is
  already owned by a different Module at the same label.
  """
  migrateClassId(
    moduleName: String!
    className: String!
    classKind: String!
    newId: ID!
  ): Boolean!
    @authentication

  """
  Admin: revive an orphaned class — flips HAS_ORPHANED_CLASS edge back to
  HAS_CLASS. Idempotent: revive of an already-active class returns true
  without an event emission. Edge properties are preserved across the
  rename.
  """
  reviveOrphanedClass(
    classId: ID!
    classKind: String!
  ): Boolean!
    @authentication

  """
  Admin: hard-delete an orphaned class. With cascade=false (default),
  refuses if any :IS_INSTANCE_OF edges exist — operator should query
  `incomingInstanceCount` first to know the cascade scope. With
  cascade=true, DETACH DELETE removes the class AND every incident
  instance node (Analyses, Components, etc. depending on classKind) —
  irreversible at the data layer.
  """
  deleteOrphanedClass(
    classId: ID!
    classKind: String!
    cascade: Boolean! = false
  ): Boolean!
    @authentication

  """
  Admin: re-runs the PR 0 idempotent class-identity cleanup against the
  current DB. dryRun=true (default) reports planned changes without
  writing. Safe to invoke any time — running twice produces identical
  end state.
  """
  runIdentityMigration(dryRun: Boolean! = true): IdentityMigrationReport!
    @authentication
}

"""Result of runIdentityMigration. Counts are 'planned' if dryRun=true, 'applied' otherwise. `details` is the human-readable per-action log (one entry per dedup group + mutating action)."""
type IdentityMigrationReport @authentication @node {
  "True if this was a dry-run (no writes performed)."
  dryRun: Boolean!
  "Sum of mutating actions performed (or planned, in dry-run)."
  totalActions: Int!
  "Per-source breakdown — log-line strings."
  details: [String!]!
}

"""Per-class strict-mode rebind conflict detail. Surfaces the diff between the module's declared id at last install and the DB-resident id, so an operator can pick a resolution direction in `ConflictResolutionDialog`."""
type RebindConflictDetail @authentication @node {
  "Class name (stable identifier across rebinds)."
  className: String!
  "Class kind label ('ComponentClass' | 'AnalysisClass' | …)."
  classKind: String!
  "Current id of the class in the DB."
  dbId: ID!
  "Id the module declared at the last install attempt (resolved from `Module.lastInstallClassIds`)."
  moduleDeclaredId: ID!
}

"""Generic (parent-label, count) pair. Used by `*Class.incomingInstancesByType` to break down :IS_INSTANCE_OF edges by parent label, so `CascadeDeleteDialog` can warn when 'Analyses' (user work) are present."""
type TypeCount @authentication @node {
  "Parent node label (e.g. 'Analysis', 'Component', 'Issue')."
  type: String!
  "Number of incoming :IS_INSTANCE_OF edges from nodes of this label."
  count: Int!
}

"""
Discriminated event from the in-memory class-identity event log.
The `kind` field is the discriminant ('rebind' | 'rebind-conflict' |
'collision' | 'orphan' | 'revive'); per-kind fields are nullable on
the union shape and populated based on the discriminant value.
"""
type ClassIdentityEvent @authentication @node {
  "Discriminant: 'rebind' | 'rebind-conflict' | 'collision' | 'orphan' | 'revive'"
  kind: String!
  "ISO timestamp of event emission."
  timestamp: String!
  "Module name (null for collision events — see firstModuleName/secondModuleName)."
  moduleName: String
  "Pluralized class-kind key from @dethernety/dt-module ('analysisClasses' | 'componentClasses' | ...)."
  classKind: String
  "Class name (the human-readable identifier)."
  className: String
  # rebind / rebind-conflict
  "Pre-rebind id (rebind events) or current DB id (rebind-conflict events)."
  oldId: String
  "Post-rebind id (rebind events only)."
  newId: String
  "Module-declared id (rebind-conflict events only)."
  moduleDeclaredId: String
  "Current DB id at time of conflict (rebind-conflict events only)."
  dbId: String
  "Rebind policy applied: 'audit' | 'silent' | 'strict'."
  policy: String
  # orphan / revive
  "Class id (orphan / revive events)."
  classId: String
  "Reason for orphaning ('absent-from-metadata' | 'legacy-id-superseded')."
  reason: String
  # collision
  "First module of a collision (the one that created the colliding id)."
  firstModuleName: String
  "Second module of a collision (the one whose install was rejected)."
  secondModuleName: String
  "The id that collided across modules."
  collidingId: String
}

