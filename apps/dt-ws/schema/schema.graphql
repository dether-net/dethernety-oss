  "Module version"
  version: String!
  "Free-text description"
  description: String
  "Models this module is loaded in"
  model: [Model!]! @relationship(type: "HAS_MODULE", direction: IN)
  "Component classes provided by this module"
  componentClasses: [ComponentClass!]! @relationship(type: "HAS_CLASS", direction: OUT)
  "Component classes retired by this module (still attached to existing instances)"
  orphanedComponentClasses: [ComponentClass!]! @relationship(type: "HAS_ORPHANED_CLASS", direction: OUT)
  "Data flow classes provided by this module"
  dataFlowClasses: [DataFlowClass!]! @relationship(type: "HAS_CLASS", direction: OUT)
  "Data flow classes retired by this module"
  orphanedDataFlowClasses: [DataFlowClass!]! @relationship(type: "HAS_ORPHANED_CLASS", direction: OUT)
  "Security boundary classes provided by this module"
  securityBoundaryClasses: [SecurityBoundaryClass!]! @relationship(type: "HAS_CLASS", direction: OUT)
  "Security boundary classes retired by this module"
  orphanedSecurityBoundaryClasses: [SecurityBoundaryClass!]! @relationship(type: "HAS_ORPHANED_CLASS", direction: OUT)
  "Control classes provided by this module"
  controlClasses: [ControlClass!]! @relationship(type: "HAS_CLASS", direction: OUT)
  "Control classes retired by this module"
  orphanedControlClasses: [ControlClass!]! @relationship(type: "HAS_ORPHANED_CLASS", direction: OUT)
  "Data classes provided by this module"
  dataClasses: [DataClass!]! @relationship(type: "HAS_CLASS", direction: OUT)
  "Data classes retired by this module"
  orphanedDataClasses: [DataClass!]! @relationship(type: "HAS_ORPHANED_CLASS", direction: OUT)
  "Analysis classes provided by this module"
  analysisClasses: [AnalysisClass!]! @relationship(type: "HAS_CLASS", direction: OUT)
  "Analysis classes retired by this module (still attached to existing analyses)"
  orphanedAnalysisClasses: [AnalysisClass!]! @relationship(type: "HAS_ORPHANED_CLASS", direction: OUT)
  "Issue classes provided by this module"
  issueClasses: [IssueClass!]! @relationship(type: "HAS_CLASS", direction: OUT)
  "Issue classes retired by this module (still attached to existing issues)"
  orphanedIssueClasses: [IssueClass!]! @relationship(type: "HAS_ORPHANED_CLASS", direction: OUT)
  "Module configuration template (resolved at runtime)"
  template: String @customResolver(requires: "name")
  "Module configuration attributes (JSON string)"
  attributes: String
  "File system path to the module"
  path: String

  # ── Class-identity admin surface ───────────────────────────────────────
  # The four scalar fields below are persisted on the Module node by the
  # module install flow. The two `@customResolver` fields aggregate from
  # sources off the Module node (the in-memory class-identity event log
  # and the bootstrap constraint-check state) and are wired in
  # ClassIdentityResolverService.

  "Effective ID rebind policy from the module's metadata at last install ('audit' | 'strict' | 'silent')."
  idRebindPolicy: String

  "Status of the most recent install attempt: 'authoritative' | 'partial' | 'unavailable' | 'error'. Null if the module has never been installed."
  lastInstallStatus: String

  "ISO timestamp of the most recent install attempt (success or failure). Null if never installed."
  lastAttemptedInstall: DateTime

  "ISO timestamp of the most recent install that completed without partial/unavailable/error markers. Null if never had a clean install."
  lastAuthoritativeInstall: DateTime

  "JSON snapshot of `[{classKind, className, declaredId}, ...]` written at the last install attempt. Internal — used to resolve `rebindConflicts.moduleDeclaredId` after a strict-mode block. Self-healing: every install overwrites the snapshot; null until the module's first install."
  lastInstallClassIds: String

  "Per-class strict-mode rebind conflicts from the most recent install. Resolver joins `lastInstallClassIds` against the current DB ids; rows where they differ are surfaced as conflicts. Empty list if the module has never been installed (no snapshot) or every declared id matches the DB."
  rebindConflicts: [RebindConflictDetail!]! @customResolver(requires: "name lastInstallClassIds lastAttemptedInstall")

  "True if all schema constraints required by the class-identity safety net were created at startup; false if any label was skipped due to dirty data. Reflects the bootstrap result from EnsureConstraintsService — same value for every Module today (the safety net is a global property of the deployment, exposed per-Module for surfaceability in any modules-list view)."
  constraintsHealthy: Boolean! @customResolver(requires: "name")
}

"""A component class definition provided by a module (e.g., Web Server, Database, API Gateway)."""
type ComponentClass implements Element  @authentication @node {
  "Unique identifier"
  id: ID! @id
  "Class name"
  name: String!
  "Free-text description"
  description: String
  "Component type this class represents"
  type: ComponentType!
  "Grouping category within the module"
  category: String
  "Module that provides this class"
  module: [Module!]! @relationship(type: "HAS_CLASS", direction: IN)
  "File path within the module"
  path: String
  "Components that are instances of this class"
  components: [Component!]! @relationship(type: "IS_INSTANCE_OF", direction: OUT)
  "Configuration template (resolved at runtime)"
  template: String @customResolver(requires: "id module { name }")
  "User-facing guide content (resolved at runtime)"
  guide: String @customResolver(requires: "id module { name }")
  "Timestamp at which this class was last orphaned (HAS_CLASS → HAS_ORPHANED_CLASS rename). Null if never orphaned."
  orphanedAt: DateTime
  "Count of incoming :IS_INSTANCE_OF edges. Read by operators before invoking deleteOrphanedClass to decide cascade safety."
  incomingInstanceCount: Int!
    @cypher(
      statement: """
      MATCH (this)<-[r:IS_INSTANCE_OF]-()
      RETURN count(r) AS n
      """
      columnName: "n"
    )
  "Breakdown of incoming :IS_INSTANCE_OF edges by parent node label. Used by CascadeDeleteDialog to surface 'this includes user work (Analyses)' warnings via the parent-label rows."
  incomingInstancesByType: [TypeCount!]!
    @cypher(
      statement: """
      MATCH (this)<-[r:IS_INSTANCE_OF]-(n)
      WITH labels(n)[0] AS type, count(r) AS count
      RETURN { type: type, count: count } AS row
      """
      columnName: "row"
    )
}

