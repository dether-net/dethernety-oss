"""A control class's fit for a set of element types."""
type ControlClassFit {
  "Class ID"
  classId: ID!
  "Class name"
  className: String!
  "Module ID this class belongs to"
  moduleId: ID!
  "Module name"
  moduleName: String!
  "Whether this class's supportedTypes includes any of the queried element types"
  compatible: Boolean!
  "Number of countermeasures generated for this class (>0 means configured)"
  countermeasureCount: Int!
}

"""A control candidate with per-class fit details."""
type ControlCandidate {
  "Control ID"
  controlId: ID!
  "Control name"
  controlName: String!
  "Per-class fit details"
  classes: [ControlClassFit!]!
  "Total countermeasures across all classes"
  totalCountermeasures: Int!
  "Element IDs this control already SUPPORTS"
  assignedElementIds: [ID!]!
}

"""Result of the reindexClassEmbeddings mutation."""
type ReindexResult {
  "Number of class nodes that were re-embedded"
  reindexedCount: Int!
  "Names of modules whose classes were re-embedded"
  moduleNames: [String!]!
}

"""
Set of Model IDs that reference a given Control via SUPPORTS edges.

Used by the control-library push pipeline to gate brownfield attribute edits
on shared Controls (shared = assigned to more than one model). See
CONTROL_LIBRARY.md §6 for the shared-ownership safety contract.
"""
type ControlAssignedModels {
  "Control UUID"
  controlId: ID!
  "Set of Model UUIDs reachable via SUPPORTS edges (deduplicated across branches)"
  modelIds: [ID!]!
}

"""
Per-(Control, ControlClass) instantiation attribute payload from the
IS_INSTANCE_OF edge. Backs the control-library pull and push-brownfield
refresh pipelines. See CONTROL_LIBRARY.md §7.
"""
type ControlInstantiationAttribute {
  "Control UUID"
  controlId: ID!
  "ControlClass UUID — null if the Control has no IS_INSTANCE_OF edge to any ControlClass"
  classId: ID
  "Edge properties (the per-instance attribute payload). Null when classId is null."
  attributes: JSON
}

type Query {
  "Get all exposures attached to a specific element"
  getExposuresForElement(elementId: String!): [Exposure!]!
    @cypher(
      statement: """
      MATCH (e {id: $elementId})-[:HAS_EXPOSURE]->(ex:Exposure)
      RETURN ex
      """
      columnName: "ex"
    )
    @authentication

  "Get the instantiation attributes from a component-to-class relationship"
  getAttributesFromClassRel(
    componentId: String!
    classId: String!
  ): JSON
    @cypher(
      statement: """
      MATCH (c {id: $componentId})
      MATCH (t {id: $classId})
      OPTIONAL MATCH (c)-[r:IS_INSTANCE_OF]->(t)
      RETURN COALESCE(r, {}) AS attributes
      """
      columnName: "attributes"
    )
    @authentication

  "Get models that are not already represented by a component in the given model"
  getNotRepreseningModels(
    modelId: String!
  ): [Model!]
    @cypher(
      statement: """
      MATCH (src:Model {id:$modelId})
      MATCH (src)<-[:REPRESENTS_MODEL]-(comp)
      MATCH (comp)-[:BELONGS_TO|CONTAINS*1..]-(mod:Model)
      WITH COLLECT(DISTINCT mod) AS connectedModels
      MATCH (m:Model)
      WHERE m.id <> $modelId
        AND NOT m IN connectedModels
      RETURN m
      """
      columnName: "m"
    )
    @authentication

  "Get analysis result values by key"
  getAnalysisValues(
    analysisId: String!
    valueKey: String!
  ): JSON!
    @authentication

  "Get a document from the analysis document store"
  getDocument(
    analysisId: String!
    filter: JSON!
  ): JSON!
    @authentication

  "List module names that have frontend bundles available"
  getAvailableFrontendModules: [String!]!
    @authentication

  "Get the compiled frontend bundle for a module"
  getModuleFrontendBundle(moduleName: String!): String!
    @authentication

  "Match elements against class catalog nodes using a multi-priority pipeline"
  matchClasses(input: MatchClassesInput!): MatchClassesResult!
    @authentication

  "Find control IDs that have a SUPPORTS relationship to any of the given element IDs"
  controlIdsByElements(elementIds: [ID!]!): [ID!]!
    @authentication

  "Analyze control gaps for a model by traversing the MITRE framework chain"
  controlGaps(input: ControlGapsInput!): ControlGapsResult!
    @authentication

  "Find control candidates whose classes support the given element types, with per-class fit details"
  controlCandidatesForType(
    elementTypes: [ComponentType!]!
    moduleIds: [ID!]
  ): [ControlCandidate!]!
    @authentication

  """
  Batched lookup of the live set of Model IDs that reference each given Control
  via SUPPORTS edges. Used by the brownfield push pipeline's shared-ownership
  check (CONTROL_LIBRARY.md §6). Per-label indexes on id are required for
  production-scale performance (see §9 Platform / database).

  Reaches Models via two branches: (1) components/boundaries the Control
  supports, and (2) DataFlows the Control supports (reached via FLOWS-attached
  components). Empty modelIds is valid — the Control has no SUPPORTS edges yet.
  """
  getControlsAssignedModels(controlIds: [ID!]!): [ControlAssignedModels!]!
    @cypher(
      statement: """
      UNWIND $controlIds AS cid
      MATCH (c:Control {id: cid})
      // Branch 1: Component / SecurityBoundary supports — aggregate before
      // branch 2 to avoid Cartesian inflation when a Control supports both
      // a Component and a DataFlow.
      // Depth bound *0..50 — the prior *0..10 silently failed open on
      // deeply-nested SecurityBoundary trees (12+ levels), under-counting
      // assigned models and biasing the shared-ownership safety check
      // toward "alone" (UX-friendly but unsafe). 50 is a defensible ceiling
      // pending a telemetry-driven bootstrap warning.
      OPTIONAL MATCH (c)-[:SUPPORTS]->(e) WHERE e:Component OR e:SecurityBoundary
      OPTIONAL MATCH (m1:Model)-[:CONTAINS]->(:SecurityBoundary)<-[:BELONGS_TO*0..50]-(e)
      WITH cid, c, collect(DISTINCT m1.id) AS ids1
      // Branch 2: DataFlow supports reach a Model via FLOWS-attached Components.
      OPTIONAL MATCH (c)-[:SUPPORTS]->(df:DataFlow)
      OPTIONAL MATCH (df)-[:FLOWS]-(:Component)-[:BELONGS_TO*0..50]->(:SecurityBoundary)<-[:CONTAINS]-(m2:Model)
      WITH cid, ids1 + collect(DISTINCT m2.id) AS combined
      // List-comprehension dedup preserves empty-result rows (UNWIND of [] would drop the cid row).
      // Index-based dedup is the Memgraph-3.x-compatible alternative to apoc.coll.toSet().
      WITH cid, [m IN combined WHERE m IS NOT NULL] AS filtered
      WITH cid, [i IN range(0, size(filtered)-1) WHERE NOT filtered[i] IN filtered[0..i] | filtered[i]] AS modelIds
      RETURN { controlId: cid, modelIds: modelIds } AS result
      """
      columnName: "result"
    )
    @authentication

  """
  Batched lookup of per-(Control, ControlClass) instantiation attributes
  (IS_INSTANCE_OF edge properties) for the given Control IDs. Backs the
  control-library pull and the brownfield push Step B refresh.

  A Control with no IS_INSTANCE_OF edge returns one row with classId = null
  and attributes = null. A Control that is an instance of multiple
  ControlClasses returns one row per (controlId, classId) pair.
  """
  getControlInstantiationAttributes(controlIds: [ID!]!): [ControlInstantiationAttribute!]!
    @cypher(
      statement: """
      MATCH (c:Control) WHERE c.id IN $controlIds
      OPTIONAL MATCH (c)-[r:IS_INSTANCE_OF]->(cc:ControlClass)
      // Memgraph 3.x quirk: properties(null) returns {} not null. Explicit
      // CASE ensures attributes is genuinely null when the edge doesn't exist
      // — required by the §7 brownfield-pull contract (the wrapper distinguishes
      // "instance with empty attributes" from "no instance").
      RETURN { controlId: c.id, classId: cc.id, attributes: CASE WHEN r IS NULL THEN null ELSE properties(r) END } AS result
      """
      columnName: "result"
    )
    @authentication

  """
  Admin: returns structured class-identity events from the in-memory ring
  buffer (max 1000 events, drop-oldest, process-local — pre-restart
  events are not persisted). Admin-gated to avoid surfacing per-module
  operational state to non-admin authenticated users in multi-tenant
  deployments. Filter by `kind` ('rebind' | 'rebind-conflict' |
  'collision' | 'orphan' | 'revive'), `moduleName`, and/or `since`
  (events at-or-after the timestamp are returned).
  """
  classIdentityEvents(
    kind: String
    moduleName: String
    since: String
  ): [ClassIdentityEvent!]!
    @authentication
}

"""Metadata about the AI model response."""
type ResponseMetadata {
  "Why the model stopped generating (e.g., stop, length, tool_use)"
  finish_reason: String
  "Name of the AI model that produced the response"
  model_name: String
  "Backend system fingerprint for reproducibility"
  system_fingerprint: String
}

"""A streamed response from an AI analysis agent."""
type AIResponse {
  "Text content of the response"
  content: String
  "Provider-specific extra fields"
  additional_kwargs: JSON
  "Model response metadata (finish reason, model name)"
  response_metadata: ResponseMetadata
  "Message type (e.g., ai, human, tool)"
  type: String
  "Agent or tool name"
  name: String
  "Message identifier"
  id: String
  "Whether this is an example message used for few-shot prompting"
  example: Boolean
  "Tool calls requested by the agent"
  tool_calls: [JSON!]
  "Tool calls that failed validation"
  invalid_tool_calls: [JSON!]
  "Token usage statistics"
  usage_metadata: JSON
  "Partial tool call data from streaming chunks"
  tool_call_chunks: [JSON!]
}

# Note: @authentication is not supported on Subscription by @neo4j/graphql v7.
# Subscription auth is enforced by JwtAuthGuard on the controller.
type Subscription {
  "Subscribe to streamed AI responses for a given analysis session"
  streamResponse(sessionId: String!): AIResponse!
}
