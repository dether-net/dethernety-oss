#graphql

scalar JSON

"""Component type (process, database, external entity, etc.)."""
enum ComponentType {
  "A running process or service"
  PROCESS
  "An external actor or system outside the model boundary"
  EXTERNAL_ENTITY
  "A data store (database, file system, cache)"
  STORE
  "A logical grouping boundary"
  BOUNDARY
  "A trust boundary separating zones of different trust levels"
  SECURITY_BOUNDARY
  "A data flow connection between components"
  DATA_FLOW
  "A data class"
  DATA
  "A control class"
  CONTROL
}

"""Class label identifying which node type to match against."""
enum ClassLabelEnum {
  "Component classes (PROCESS, STORE, EXTERNAL_ENTITY)"
  COMPONENT
  "Security boundary classes"
  SECURITY_BOUNDARY
  "Data flow classes"
  DATA_FLOW
  "Data classes"
  DATA
  "Control classes"
  CONTROL
}

"""Optional fields to include on match candidates."""
enum MatchClassFieldEnum {
  description
  category
  type
}

"""How the match was determined."""
enum MatchType {
  exact_name
  fuzzy_name
  vector_similarity
  type_match
}

"""Confidence level of the match."""
enum ConfidenceLevel {
  high
  medium
  low
}

"""Trust level assigned to a security boundary."""
enum TrustLevel {
  "No trust — external or hostile zone"
  UNTRUSTED
  "Partial trust — DMZ or shared zone"
  SEMI_TRUSTED
  "Full trust — internal or protected zone"
  TRUSTED
}

"""CVSS v3.1-aligned attack vector classification for exposures."""
enum AttackVector {
  "Exploitable from any network without preconditions"
  NETWORK
  "Requires same shared physical or logical network segment"
  ADJACENT
  "Requires local access (shell, code execution)"
  LOCAL
  "Requires physical hardware access"
  PHYSICAL
  "Not yet classified by the policy author"
  UNSPECIFIED
}

# NOTE: The `createdBy` field on Exposure and Countermeasure is typed as
# String (not a GraphQL enum) so the @populatedBy directive can be
# applied — @populatedBy in @neo4j/graphql v7 is restricted to scalar
# field types (no enum support). Allowed values are 'SYSTEM' and 'USER'.
# Server-enforced via @populatedBy(callback: stampCreatedByUserOnCreate)
# which overrides client input on the auto-generated CREATE mutations.
# Cypher-direct SYSTEM writes (SetInstantiationAttributesService) stamp
# 'SYSTEM' inline. The dt-core TypeScript interface narrows this as a
# string literal union `'SYSTEM' | 'USER'` for client-side type safety.

"""Value types for dynamic attributes."""
enum ValueType {
  "A text value"
  STRING
  "A numeric value (integer or float)"
  NUMBER
  "A true/false value"
  BOOLEAN
  "A date or datetime value"
  DATE
}

"""Structured argument the user authors for treating a SYSTEM finding differently."""
enum DispositionKind {
  "Finding does not apply to this element / model context"
  NOT_APPLICABLE
  "Finding is incorrect — the underlying weakness does not exist as described"
  FALSE_POSITIVE
  "A compensating control mitigates the finding to an acceptable residual risk"
  COMPENSATING_CONTROL
  "Risk has been formally accepted; finding remains documented"
  RISK_ACCEPTED
  "We have decided not to implement this control (control waiver). Countermeasure-only."
  WAIVED
  "Finding has been replaced by a user-authored exposure that better fits the model"
  SUPERSEDED
}

"""Error taxonomy for disposeExposure / clearDisposition mutations."""
enum DispositionErrorCode {
  "Input failed validation (reason empty, kind missing, exposureId malformed)"
  VALIDATION_ERROR
  "No Exposure matched the supplied exposureId"
  EXPOSURE_NOT_FOUND
  "Underlying graph write failed for an infrastructure reason"
  DATABASE_ERROR
}

"""MITRE corpus selector for matchMitreTechniques. Determines which HNSW index is consulted."""
enum MitreKind {
  "MITRE ATT&CK adversary technique (T-codes; e.g. T1003, T1003.001)"
  ATTACK_TECHNIQUE
  "MITRE D3FEND defensive technique (D3-codes; e.g. D3-PMAD)"
  DEFEND_TECHNIQUE
  "MITRE ATT&CK mitigation (M-codes; e.g. M1041)"
  ATTACK_MITIGATION
}

"""How a MITRE candidate matched the user's query. Distinct vocabulary from MatchType (matchClasses): MITRE matching cascades through id / name / description / vector tiers."""
enum MitreMatchType {
  "Query exactly equals the MITRE id (e.g. 'T1003' → T1003)"
  EXACT_ID
  "Query is a prefix of the MITRE id (e.g. 'T100' → T1003)"
  PREFIX_ID
  "Query substring matched the candidate's name"
  NAME_MATCH
  "Query substring matched the candidate's description"
  DESCRIPTION_MATCH
  "Server-computed embedding cosine-similarity match against the HNSW index"
  VECTOR_SIMILARITY
}

"""Why the vector tier of matchMitreTechniques is disabled. Drives the picker caption and lets it differentiate deployment-lacks-vector from module-misalignment."""
enum VectorDisabledReason {
  "EMBEDDING_ENABLED is false in the deployment's environment"
  EMBEDDING_DISABLED
  "Graph backend lacks the vector_search procedure (Neo4j, or older Memgraph)"
  NO_INDEX_MODULE
  "MITRE module shipped no embeddings, or per-label coverage is incomplete (partial install)"
  NO_VECTORS
  "Module's embeddingModel disagrees with the platform's runtime EMBEDDING_MODEL"
  MODEL_MISMATCH
}

"""Base interface implemented by all graph-stored entities."""
interface Element {
  "Unique identifier"
  id: ID!
  "Display name"
  name: String!
  "Free-text description"
  description: String
}

"""Organizational folder for grouping models and controls."""
type Folder implements Element @authentication @node {
  "Unique identifier"
  id: ID! @id
  "Folder name"
  name: String!
  "Free-text description"
  description: String
  "Parent folder (if nested)"
  parentFolder: [Folder!]! @relationship(type: "FOLDER_CONTAINS", direction: IN)
  "Child folders"
  childrenFolders: [Folder!]! @relationship(type: "FOLDER_CONTAINS", direction: OUT)
  "Models in this folder"
  models: [Model!]! @relationship(type: "FOLDER_CONTAINS", direction: OUT)
  "Controls in this folder"
  controls: [Control!]! @relationship(type: "FOLDER_CONTAINS", direction: OUT)
}

"""A threat model containing components, data flows, boundaries, and analysis results."""
type Model implements Element  @authentication @node {
  "Unique identifier"
  id: ID! @id
  "Model name"
  name: String!
  "Free-text description"
  description: String
  "Top-level security boundaries in this model"
  defaultBoundary: [SecurityBoundary!]! @relationship(type: "CONTAINS", direction: OUT)
  """
  Modules previously attached to this model. UI-deprecated as of 2026-05 —
  the class picker uses the global module catalogue via listClasses / matchClasses.
  Reserved for potential future governance use cases (catalogue scoping policy).
  Do not reintroduce a UI for this relationship without revisiting the
  class-picker design.
  """
  modules: [Module!]!
    @relationship(type: "HAS_MODULE", direction: OUT)
    @deprecated(reason: "UI-deprecated as of 2026-05. Class picker uses the global catalogue via listClasses/matchClasses. Reserved for future governance use cases — do not reintroduce a UI without revisiting the class-picker design.")
  "Controls applied to this model"
  controls: [Control!]! @relationship(type: "SUPPORTS", direction: IN)
  "Data elements defined in this model"
  dataItems: [Data!]! @relationship(type: "CONTAINS", direction: OUT)
  "Components that represent this model (for model-in-model composition)"
  representedBy: [Element!]! @relationship(type: "REPRESENTS_MODEL", direction: IN)
  "Analyses run against this model"
  analyses: [Analysis!]! @relationship(type: "ANALYZED_BY", direction: OUT)
  "Issues associated with this model"
  issues: [Issue!]! @relationship(type: "HAS_ISSUE", direction: OUT)
  "Folder containing this model"
  folder: [Folder!]! @relationship(type: "FOLDER_CONTAINS", direction: IN)
}

"""A modeled entity in the system (process, database, external entity, etc.)."""
type Component implements Element  @authentication @node {
  "Unique identifier"
  id: ID! @id
  "Component name"
  name: String!
  "Free-text description"
  description: String
  "Component type (process, store, external entity, etc.)"
  type: ComponentType!
  "Security boundary this component belongs to"
  parentBoundary: [SecurityBoundary!]! @relationship(type: "BELONGS_TO", direction: OUT)
  "Outgoing data flows from this component"
  flowsFrom: [DataFlow!]! @relationship(type: "FLOWS", direction: OUT)
  "Incoming data flows to this component"
  flowsTo: [DataFlow!]! @relationship(type: "FLOWS", direction: IN)
  "Security exposures identified on this component"
  exposures: [Exposure!]! @relationship(type: "HAS_EXPOSURE", direction: OUT)
  "Controls applied to this component"
  controls: [Control!]! @relationship(type: "SUPPORTS", direction: IN)
  "Data elements handled by this component"
  dataItems: [Data!]! @relationship(type: "HANDLES", direction: OUT)
  "Class this component is an instance of"
  componentClass: [ComponentClass!]! @relationship(type: "IS_INSTANCE_OF", direction: OUT)
  "Model represented by this component (for model-in-model composition)"
  representedModel: [Model!]! @relationship(type: "REPRESENTS_MODEL", direction: OUT)
  "Analyses run against this component"
  analyses: [Analysis!]! @relationship(type: "ANALYZED_BY", direction: OUT)
  "Issues associated with this component"
  issues: [Issue!]! @relationship(type: "HAS_ISSUE", direction: OUT)
  "X position on the canvas"
  positionX: Float
  "Y position on the canvas"
  positionY: Float
  "Width on the canvas"
  dimensionsWidth: Float
  "Height on the canvas"
  dimensionsHeight: Float
}

"""A directed data flow between two components."""
type DataFlow implements Element  @authentication @node {
  "Unique identifier"
  id: ID! @id
  "Data flow name"
  name: String!
  "Free-text description"
  description: String
  "Source component of this data flow"
  source: [Component!]! @relationship(type: "FLOWS", direction: IN)
  "Target component of this data flow"
  target: [Component!]! @relationship(type: "FLOWS", direction: OUT)
  "Source handle identifier (for canvas rendering)"
  sourceHandle: String
  "Target handle identifier (for canvas rendering)"
  targetHandle: String
  "Data flow protocol or transport types (e.g., HTTP, gRPC)"
  dataFlowTypes: [String!]
  "Analyses run against this data flow"
  analyses: [Analysis!]! @relationship(type: "ANALYZED_BY", direction: OUT)
  "Security exposures identified on this data flow"
  exposures: [Exposure!]! @relationship(type: "HAS_EXPOSURE", direction: OUT)
  "Controls applied to this data flow"
  controls: [Control!]! @relationship(type: "SUPPORTS", direction: IN)
  "Data elements carried by this data flow"
  dataItems: [Data!]! @relationship(type: "HANDLES", direction: OUT)
  "Class this data flow is an instance of"
  dataFlowClass: [DataFlowClass!]! @relationship(type: "IS_INSTANCE_OF", direction: OUT)
  "Issues associated with this data flow"
  issues: [Issue!]! @relationship(type: "HAS_ISSUE", direction: OUT)
}

"""A trust boundary separating zones of different trust levels (e.g., network boundary, DMZ)."""
type SecurityBoundary implements Element  @authentication @node {
  "Unique identifier"
  id: ID! @id
  "Boundary name"
  name: String!
  "Free-text description"
  description: String
  "Model this boundary belongs to"
  model: [Model!]! @relationship(type: "CONTAINS", direction: IN)
  "Trust level of this boundary (untrusted, semi-trusted, trusted)"
  trustLevel: TrustLevel!
  "Components inside this boundary"
  components: [Component!]! @relationship(type: "BELONGS_TO", direction: IN)
  "Nested child boundaries"
  childBoundaries: [SecurityBoundary!]! @relationship(type: "BELONGS_TO", direction: IN)
  "Parent boundary (if nested)"
  parentBoundary: [SecurityBoundary!]! @relationship(type: "BELONGS_TO", direction: OUT)
  "Security exposures identified on this boundary"
  exposures: [Exposure!]! @relationship(type: "HAS_EXPOSURE", direction: OUT)
  "Controls applied to this boundary"
  controls: [Control!]! @relationship(type: "SUPPORTS", direction: IN)
  "Data elements handled within this boundary"
  dataItems: [Data!]! @relationship(type: "HANDLES", direction: OUT)
  "Class this boundary is an instance of"
  securityBoundaryClass: [SecurityBoundaryClass!]! @relationship(type: "IS_INSTANCE_OF", direction: OUT)
  "Model represented by this boundary (for model-in-model composition)"
  representedModel: [Model!]! @relationship(type: "REPRESENTS_MODEL", direction: OUT)
  "Analyses run against this boundary"
  analyses: [Analysis!]! @relationship(type: "ANALYZED_BY", direction: OUT)
  "Issues associated with this boundary"
  issues: [Issue!]! @relationship(type: "HAS_ISSUE", direction: OUT)
  "X position on the canvas"
  positionX: Float
  "Y position on the canvas"
  positionY: Float
  "Width on the canvas"
  dimensionsWidth: Float
  "Height on the canvas"
  dimensionsHeight: Float
  "Minimum width on the canvas"
  dimensionsMinWidth: Float
  "Minimum height on the canvas"
  dimensionsMinHeight: Float
  "All nested boundaries at any depth (computed via Cypher traversal)"
  allDescendantBoundaries: [SecurityBoundary!]!
    @cypher(
      statement: """
      MATCH (this)<-[:BELONGS_TO*1..50]-(sb:SecurityBoundary)
      RETURN DISTINCT sb
      """,
      columnName: "sb"
    )
  # Depth bound *1..50 mirrors `allDescendantComponents` and the
  # shared-ownership reach below, so operators with deep topologies see
  # the same ceiling everywhere. The 1-anchor (vs. 0) here is deliberate:
  # `allDescendantBoundaries` excludes `this`.
  "All components inside this boundary or any nested boundary (computed)"
  allDescendantComponents: [Component!]!
    @cypher(
      statement: """
      MATCH (this)<-[:BELONGS_TO*0..50]-(sb:SecurityBoundary)
      WITH DISTINCT sb
      MATCH (sb)<-[:BELONGS_TO]-(c:Component)
      RETURN DISTINCT c
      """,
      columnName: "c"
    )
  "All data flows touching components in this boundary or nested boundaries (computed)"
  allDescendantDataFlows: [DataFlow!]!
    @cypher(
      statement: """
      MATCH (this)<-[:BELONGS_TO*0..50]-(sb:SecurityBoundary)
      WITH DISTINCT sb
      MATCH (sb)<-[:BELONGS_TO]-(c:Component)
      WITH DISTINCT c
      MATCH (c)-[:FLOWS]-(df:DataFlow)
      RETURN DISTINCT df
      """,
      columnName: "df"
    )
}

