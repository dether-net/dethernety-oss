"""
Per-(Control, ControlClass) instantiation attribute payload from the
IS_INSTANCE_OF edge. Backs the control-library pull and push-brownfield
refresh pipelines. See CONTROL_LIBRARY.md §7.
"""
type ControlInstantiationAttribute {
  "Control UUID"
  controlId: ID!
  "ControlClass UUID — null if the Control has no IS_INSTANCE_OF edge to any ControlClass"
  classId: ID
  "Edge properties (the per-instance attribute payload). Null when classId is null."
  attributes: JSON
}

type Query {
  "Get all exposures attached to a specific element"
  getExposuresForElement(elementId: String!): [Exposure!]!
    @cypher(
      statement: """
      MATCH (e {id: $elementId})-[:HAS_EXPOSURE]->(ex:Exposure)
      RETURN ex
      """
      columnName: "ex"
    )
    @authentication

  "Get the instantiation attributes from a component-to-class relationship"
  getAttributesFromClassRel(
    componentId: String!
    classId: String!
  ): JSON
    @cypher(
      statement: """
      MATCH (c {id: $componentId})
      MATCH (t {id: $classId})
      OPTIONAL MATCH (c)-[r:IS_INSTANCE_OF]->(t)
      RETURN COALESCE(r, {}) AS attributes
      """
      columnName: "attributes"
    )
    @authentication

  "Get models that are not already represented by a component in the given model"
  getNotRepreseningModels(
    modelId: String!
  ): [Model!]
    @cypher(
      statement: """
      MATCH (src:Model {id:$modelId})
      MATCH (src)<-[:REPRESENTS_MODEL]-(comp)
      MATCH (comp)-[:BELONGS_TO|CONTAINS*1..]-(mod:Model)
      WITH COLLECT(DISTINCT mod) AS connectedModels
      MATCH (m:Model)
      WHERE m.id <> $modelId
        AND NOT m IN connectedModels
      RETURN m
      """
      columnName: "m"
    )
    @authentication

  "Get analysis result values by key"
  getAnalysisValues(
    analysisId: String!
    valueKey: String!
  ): JSON!
    @authentication

  "Get a document from the analysis document store"
  getDocument(
    analysisId: String!
    filter: JSON!
  ): JSON!
    @authentication

  "List module names that have frontend bundles available"
  getAvailableFrontendModules: [String!]!
    @authentication

  "Get the compiled frontend bundle for a module"
  getModuleFrontendBundle(moduleName: String!): String!
    @authentication

  "Match elements against class catalog nodes using a multi-priority pipeline"
  matchClasses(input: MatchClassesInput!): MatchClassesResult!
    @authentication

  """
  Match MITRE techniques / mitigations against user queries using the full
  priority cascade (EXACT_ID → PREFIX_ID → NAME_MATCH → DESCRIPTION_MATCH →
  VECTOR_SIMILARITY). Mirrors matchClasses; consumed by the TechniquePicker.
  The server returns at most
  one tier of results per query; the picker is responsible for displaying
  the server's tier-5 results below client-computed tiers 1–4.
  """
  matchMitreTechniques(input: MatchMitreTechniquesInput!): MatchMitreTechniquesResult!
    @authentication

  "Paginated class catalogue with server-aggregated facet counts. Powers the class-picker side-sheet's browse-all path."
  listClasses(input: ListClassesInput!): ListClassesResult!
    @authentication

  "Find control IDs that have a SUPPORTS relationship to any of the given element IDs"
  controlIdsByElements(elementIds: [ID!]!): [ID!]!
    @authentication

  "Analyze control gaps for a model by traversing the MITRE framework chain"
  controlGaps(input: ControlGapsInput!): ControlGapsResult!
    @authentication

  "Find control candidates whose classes support the given element types, with per-class fit details"
  controlCandidatesForType(
    elementTypes: [ComponentType!]!
    moduleIds: [ID!]
  ): [ControlCandidate!]!
    @authentication

  """
  Batched lookup of the live set of Model IDs that reference each given Control
  via SUPPORTS edges. Used by the brownfield push pipeline's shared-ownership
  check (CONTROL_LIBRARY.md §6). Per-label indexes on id are required for
  production-scale performance (see §9 Platform / database).

  Reaches Models via two branches: (1) components/boundaries the Control
  supports, and (2) DataFlows the Control supports (reached via FLOWS-attached
  components). Empty modelIds is valid — the Control has no SUPPORTS edges yet.
  """
  getControlsAssignedModels(controlIds: [ID!]!): [ControlAssignedModels!]!
    @cypher(
      statement: """
      UNWIND $controlIds AS cid
      MATCH (c:Control {id: cid})
      // Branch 1: Component / SecurityBoundary supports — aggregate before
      // branch 2 to avoid Cartesian inflation when a Control supports both
      // a Component and a DataFlow.
      // Depth bound *0..50 — the prior *0..10 silently failed open on
      // deeply-nested SecurityBoundary trees (12+ levels), under-counting
      // assigned models and biasing the shared-ownership safety check
      // toward "alone" (UX-friendly but unsafe). 50 is a defensible ceiling
      // pending a telemetry-driven bootstrap warning.
      OPTIONAL MATCH (c)-[:SUPPORTS]->(e) WHERE e:Component OR e:SecurityBoundary
      OPTIONAL MATCH (m1:Model)-[:CONTAINS]->(:SecurityBoundary)<-[:BELONGS_TO*0..50]-(e)
      WITH cid, c, collect(DISTINCT m1.id) AS ids1
      // Branch 2: DataFlow supports reach a Model via FLOWS-attached Components.
      OPTIONAL MATCH (c)-[:SUPPORTS]->(df:DataFlow)
      OPTIONAL MATCH (df)-[:FLOWS]-(:Component)-[:BELONGS_TO*0..50]->(:SecurityBoundary)<-[:CONTAINS]-(m2:Model)
      WITH cid, ids1 + collect(DISTINCT m2.id) AS combined
      // List-comprehension dedup preserves empty-result rows (UNWIND of [] would drop the cid row).
      // Index-based dedup is the Memgraph-3.x-compatible alternative to apoc.coll.toSet().
      WITH cid, [m IN combined WHERE m IS NOT NULL] AS filtered
      WITH cid, [i IN range(0, size(filtered)-1) WHERE NOT filtered[i] IN filtered[0..i] | filtered[i]] AS modelIds
      RETURN { controlId: cid, modelIds: modelIds } AS result
      """
      columnName: "result"
    )
    @authentication

  """
  Batched lookup of per-(Control, ControlClass) instantiation attributes
  (IS_INSTANCE_OF edge properties) for the given Control IDs. Backs the
  control-library pull and the brownfield push Step B refresh.

  A Control with no IS_INSTANCE_OF edge returns one row with classId = null
  and attributes = null. A Control that is an instance of multiple
  ControlClasses returns one row per (controlId, classId) pair.
  """
  getControlInstantiationAttributes(controlIds: [ID!]!): [ControlInstantiationAttribute!]!
    @cypher(
      statement: """
      MATCH (c:Control) WHERE c.id IN $controlIds
      OPTIONAL MATCH (c)-[r:IS_INSTANCE_OF]->(cc:ControlClass)
      // Memgraph 3.x quirk: properties(null) returns {} not null. Explicit
      // CASE ensures attributes is genuinely null when the edge doesn't exist
      // — required by the §7 brownfield-pull contract (the wrapper distinguishes
      // "instance with empty attributes" from "no instance").
      RETURN { controlId: c.id, classId: cc.id, attributes: CASE WHEN r IS NULL THEN null ELSE properties(r) END } AS result
      """
      columnName: "result"
    )
    @authentication

  """
  Admin: returns structured class-identity events from the in-memory ring
  buffer (max 1000 events, drop-oldest, process-local — pre-restart
  events are not persisted). Admin-gated to avoid surfacing per-module
  operational state to non-admin authenticated users in multi-tenant
  deployments. Filter by `kind` ('rebind' | 'rebind-conflict' |
  'collision' | 'orphan' | 'revive'), `moduleName`, and/or `since`
  (events at-or-after the timestamp are returned).
  """
  classIdentityEvents(
    kind: String
    moduleName: String
    since: String
  ): [ClassIdentityEvent!]!
    @authentication
}

"""Metadata about the AI model response."""
type ResponseMetadata {
  "Why the model stopped generating (e.g., stop, length, tool_use)"
  finish_reason: String
  "Name of the AI model that produced the response"
  model_name: String
  "Backend system fingerprint for reproducibility"
  system_fingerprint: String
}

"""A streamed response from an AI analysis agent."""
type AIResponse {
  "Text content of the response"
  content: String
  "Provider-specific extra fields"
  additional_kwargs: JSON
  "Model response metadata (finish reason, model name)"
  response_metadata: ResponseMetadata
  "Message type (e.g., ai, human, tool)"
  type: String
  "Agent or tool name"
  name: String
  "Message identifier"
  id: String
  "Whether this is an example message used for few-shot prompting"
  example: Boolean
  "Tool calls requested by the agent"
  tool_calls: [JSON!]
  "Tool calls that failed validation"
  invalid_tool_calls: [JSON!]
  "Token usage statistics"
  usage_metadata: JSON
  "Partial tool call data from streaming chunks"
  tool_call_chunks: [JSON!]
}

# Note: @authentication is not supported on Subscription by @neo4j/graphql v7.
# Subscription auth is enforced by JwtAuthGuard on the controller.
type Subscription {
  "Subscribe to streamed AI responses for a given analysis session"
  streamResponse(sessionId: String!): AIResponse!
}

# ---------------------------------------------------------------------------
# changeElementBinding supporting types.
#
# Discriminated input shape — GraphQL has no native input unions, so the
# `kind` enum gates which of `classIds` / `modelId` is required. The
# resolver validates the combination per the comments on each field.
#
# The output `targetBinding` is a real GraphQL union so consumers can
# pattern-match on `__typename`.
# ---------------------------------------------------------------------------

"Discriminator for the desired binding kind on an element."
enum ElementBindingKind {
  CLASS
  REPRESENTED_MODEL
  NONE
}

"""
Input shape for the desired post-mutation binding. Exactly one of
`classIds` / `modelId` must be set, gated by `kind`:
- kind = CLASS: `classIds` non-empty (length 1 for non-Controls; 0+ for Controls).
- kind = REPRESENTED_MODEL: `modelId` non-null.
- kind = NONE: both `classIds` and `modelId` null.
"""
input ElementBindingInput {
  kind: ElementBindingKind!
  classIds: [ID!]
  modelId: ID
}

"Class-based binding state (one or more ControlClasses, or exactly one of any other *Class)."
type ClassBinding {
  classIds: [ID!]!
}

"Represented-model binding state (Component / SecurityBoundary only)."
type RepresentedModelBinding {
  modelId: ID!
}

"""
Empty-binding state. GraphQL union members must declare at least one
field, so `_empty` is a placeholder. Consumers should branch on
`__typename`, not read this field.
"""
type NoBinding {
  _empty: Boolean
}

"Discriminated union describing the (echoed) post-mutation binding state."
union ElementBinding = ClassBinding | RepresentedModelBinding | NoBinding

"""
Per-mutation counts of what the single executeWrite transaction touched.
All values are zero on identity-transition short-circuit or any error
path. Counts of SYSTEM findings are split between deleted and instantiated;
USER findings only ever appear in `preserved*` (cleanup never touches
them — see ElementBindingService's destructive sweep predicates, which
require `createdBy = 'SYSTEM' OR createdBy IS NULL`).
"""
type ElementBindingDeltas {
  deletedDerivedExposures: Int!
  instantiatedDerivedExposures: Int!
  preservedCustomExposures: Int!
  deletedDerivedCountermeasures: Int!
  instantiatedDerivedCountermeasures: Int!
  preservedCustomCountermeasures: Int!
}

"""
Structured error codes returned from changeElementBinding. Null on
success. UI branches on the code; `errorMessage` carries a sanitised
human-readable string suitable for snackbar display.
"""
enum ElementBindingErrorCode {
  VALIDATION_ERROR
  ELEMENT_NOT_FOUND
  CLASS_NOT_FOUND
  MODEL_NOT_FOUND
  ORPHAN_CLASS_REFUSED
  REPRESENTED_MODEL_NOT_ALLOWED
  MODULE_ERROR
  DATABASE_ERROR
}

"""
Resolver-returned envelope. On success: `errorCode` and `errorMessage`
are null, `deltas` carry the transaction counts, `targetBinding` echoes
the binding that landed. On failure: `success = false`, `errorCode` set,
all deltas zero, no graph mutation persisted.
"""
type ChangeElementBindingResult {
  success: Boolean!
  elementId: ID!
  targetBinding: ElementBinding!
  deltas: ElementBindingDeltas!
  errorCode: ElementBindingErrorCode
  errorMessage: String
}

# ============================================================================
# setInstantiationAttributes result envelope.
# Replaces the prior Boolean! return shape. Renamed from the
# original `SetAttributesResult` to avoid TS-internal collision with the
# existing SetAttributesResult interface at
# oss/apps/dt-ws/src/gql/interfaces/set-instantiation-attributes.interface.ts.
# ============================================================================

"""
Result envelope returned by setInstantiationAttributes. `staleFlippedCount`
is non-null when the attribute write succeeded; the value is the number of
dispositioned exposures on the element whose `dispositionStale` was flipped
to true by the second statement of the staleness Cypher. Zero on no-op saves (no value
change) or when the element has no dispositioned exposures.
"""
type SetInstantiationAttributesResult {
  "True when the attribute write succeeded; false when validation or DB failure prevented the write."
  success: Boolean!
  "Number of dispositioned exposures on the element whose `dispositionStale` was flipped to true. Zero on no-op saves or when the element carries no dispositions."
  staleFlippedCount: Int
}

# ============================================================================
# Disposition mutations supporting types.
# ============================================================================

"""
Result envelope returned by both disposeExposure and clearDisposition. On
success: errorCode and errorMessage are null; the five disposition fields
echo the state landed on the Exposure (cleared mutation returns all five
as null). On failure: success = false, errorCode set, disposition fields
mirror the pre-mutation state (no graph change persisted).
"""
type DispositionMutationResult {
  success: Boolean!
  exposureId: ID!
  dispositionKind: DispositionKind
  dispositionReason: String
  dispositionedBy: String
  dispositionedAt: DateTime
  dispositionStale: Boolean
  errorCode: DispositionErrorCode
  errorMessage: String
}

# ============================================================================
# matchMitreTechniques query supporting types.
# Distinct from matchClasses surface: techniques are not type-filtered, the
# server returns at most one tier of results per query, and the vector tier
# carries a structured disabled-reason for the picker caption.
# ============================================================================

"""
Input envelope for matchMitreTechniques. Batch shape — the picker sends
single-element arrays today. Server clamps queries to MAX_QUERIES (25) and
topN to [1, 50].
"""
input MatchMitreTechniquesInput {
  "One or more query strings. Each becomes an entry in matches[] in result."
  queries: [TechniqueQueryInput!]!
  "Corpus to match against — determines which HNSW index the server consults."
  kind: MitreKind!
  "Per-query result cap. Clamped to [1, 50] server-side. Defaults to 3."
  topN: Int
}

"""Single query as part of a MatchMitreTechniquesInput.queries batch."""
input TechniqueQueryInput {
  "User-typed text. May be a MITRE id (T1003), a partial id (T100), a name fragment, or free-form intent. Hard cap MAX_QUERY_LENGTH (500)."
  query: String!
}

"""
Result envelope returned by matchMitreTechniques. matches[] is parallel to
input.queries (same order, same length). unmatched[] lists queries that
produced no candidates. vectorAvailable and vectorDisabledReason describe
the runtime's vector-tier health at request time so the picker can surface
the right caption.
"""
type MatchMitreTechniquesResult {
  matches: [TechniqueQueryMatch!]!
  unmatched: [String!]!
  "False when the deployment has no HNSW indexes, the vector_search module is absent, embedding is disabled, or the module-shipped vectors mismatch the platform's runtime model."
  vectorAvailable: Boolean!
  "When vectorAvailable is false, names the specific reason — drives the picker caption. Null when vectorAvailable is true."
  vectorDisabledReason: VectorDisabledReason
}

"""Candidate list returned for a single TechniqueQueryInput."""
type TechniqueQueryMatch {
  "Echoes the input query string so clients can correlate batched results."
  query: String!
  candidates: [MitreCandidate!]!
}

"""A single MITRE candidate. Shape is uniform across the three MitreKind values; mitreId reads from attack_id (ATT&CK) or d3fendId (D3FEND)."""
type MitreCandidate {
  "T1003 / T1003.001 / D3-PMAD / M1041 — read from attack_id (ATT&CK) or d3fendId (D3FEND)."
  mitreId: String!
  name: String!
  description: String
  "ATT&CK tactic name or D3FEND tactic name (same field; distinct vocabularies)."
  tactic: String
  kind: MitreKind!
  matchType: MitreMatchType!
  "Populated for VECTOR_SIMILARITY matches; null for the deterministic tiers (EXACT_ID, PREFIX_ID, NAME_MATCH, DESCRIPTION_MATCH)."
  similarityScore: Float
}
