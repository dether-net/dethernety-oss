"""A security exposure (vulnerability or weakness) identified on a model element."""
type Exposure implements Element  @authentication @node {
  "Unique identifier"
  id: ID! @id
  "Exposure name"
  name: String!
  "Free-text description"
  description: String
  "Exposure type"
  type: String
  "Exposure category"
  category: String
  "Risk score"
  score: Int
  "External references (URLs, CVE IDs)"
  references: String
  "Suggested mitigations"
  mitigationSuggestions: [String!]
  "Detection methods"
  detectionMethods: [String!]
  "Tags for filtering and grouping"
  tags: [String!]
  "MITRE ATT&CK technique IDs"
  techniques: [String!]
  "CVSS-aligned attack vector classification"
  attackVector: AttackVector
  "Authorship kind. 'SYSTEM' = module-instantiated via class binding. 'USER' = hand-authored. Null on legacy data is treated as SYSTEM by the cleanup paths. Server-enforced via @populatedBy on the auto-generated CREATE mutations — the callback overrides any client-supplied value with 'USER'. The SYSTEM write path goes via Cypher (SetInstantiationAttributesService) and bypasses this directive."
  createdBy: String
    @populatedBy(callback: "stampCreatedByUserOnCreate", operations: [CREATE])
    @settable(onUpdate: false)
  "Creator reference, populated server-side at CREATE time. For USER findings: the authenticated user identifier (JWT sub claim) from context, set by the @populatedBy callback. For SYSTEM findings: an optional module-provided attribution string (feed name, advisory id, researcher name) that the module includes in its return; the module value flows through the resolver's sanitised \\$attrs allowlist. Client-supplied values on auto-generated CREATE mutations are overridden by the @populatedBy callback."
  authoredBy: String
    @populatedBy(callback: "populateAuthoredByOnCreate", operations: [CREATE])
    @settable(onUpdate: false)

  "Disposition kind. Null = active (no disposition). When non-null, the user has authored a structured argument that this finding should be treated differently from the default 'actionable' interpretation. Set via the disposeExposure / Supersede flows; cleared via clearDisposition. The @neo4j/graphql auto-generated update input shape exposes this field as writeable for legitimate operator workflows (direct-GraphQL is a power-user surface); the structured mutations are the preferred path and the only one the UI exercises."
  dispositionKind: DispositionKind
  "Free-text justification authored by the user. Mandatory (non-empty after trim) when dispositionKind is non-null. Captured at dispose time and on every modification / re-affirm. For SUPERSEDED dispositions populated via the frontend Supersede flow, defaults to \"Superseded by user-authored exposure '<name>'\" — user-editable after. The single-quote wrapping around the clone's name is load-bearing for the USER-copy-delete companion staleness flip."
  dispositionReason: String
  "User id (JWT sub claim) of the user who authored the current disposition. Stamped by the disposeExposure resolver from context.user.sub. Null when dispositionKind is null. Updated on every dispose call (including re-affirm — the backend treats them identically). Server-stamped via the structured mutation only — the @settable(onCreate/onUpdate: false) directives prevent direct-GraphQL spoofing of this forensic-provenance field, matching the posture of createdBy / authoredBy above."
  dispositionedBy: String
    @settable(onCreate: false, onUpdate: false)
  "ISO-8601 timestamp when the current disposition was authored or last modified / re-affirmed. Stamped by the resolver. Null when dispositionKind is null. Updated on every dispose call. Server-stamped only — @settable directives prevent backdating via direct-GraphQL."
  dispositionedAt: DateTime
    @settable(onCreate: false, onUpdate: false)
  "True when an instantiation attribute value has changed since the disposition was last authored or re-affirmed. Flipped by SetInstantiationAttributesService inside the same transaction that writes the attribute change, and by the USER-copy-delete companion stale-flip (via the generated update mutation). Cleared by a subsequent disposeExposure call (re-affirm). Meaningful only when dispositionKind is non-null; null / false otherwise. After clearDisposition the field is null alongside the other four; null and false are semantically equivalent across all consumers. Intentionally settable via the generated update mutation so the companion flip can write it — the GUI approval dialogs are the guard on the direct-GraphQL power-user surface (a self-affecting review flag does not warrant a backend lock; cf dispositionedBy / dispositionedAt which stay @settable-locked)."
  dispositionStale: Boolean

  "Components affected by this exposure"
  component: [Component!]! @relationship(type: "HAS_EXPOSURE", direction: IN)
  "Boundaries affected by this exposure"
  securityBoundary: [SecurityBoundary!]! @relationship(type: "HAS_EXPOSURE", direction: IN)
  "Data flows affected by this exposure"
  dataFlow: [DataFlow!]! @relationship(type: "HAS_EXPOSURE", direction: IN)
  "Data elements affected by this exposure"
  data: [Data!]! @relationship(type: "HAS_EXPOSURE", direction: IN)
  "All elements affected by this exposure"
  element: [Element!]! @relationship(type: "HAS_EXPOSURE", direction: IN)
  "ATT&CK techniques that exploit this exposure"
  exploitedBy: [MitreAttackTechnique!]! @relationship(type: "EXPLOITED_BY", direction: OUT)
  "Issues associated with this exposure"
  issues: [Issue!]! @relationship(type: "HAS_ISSUE", direction: OUT)
}

