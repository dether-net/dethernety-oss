spec:
  secretStoreRef:
    name: cloud-secrets
    kind: ClusterSecretStore
  target:
    name: payvendor-webhook
  data:
    - secretKey: signing-secret
      remoteRef:
        key: orderdesk/payvendor/webhook-signing-secret
