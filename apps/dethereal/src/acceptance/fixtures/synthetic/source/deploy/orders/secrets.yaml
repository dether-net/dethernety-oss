apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: payvendor-api
  namespace: orders
  annotations:
    orderdesk.example/change-ref: pebble-meadow-lemon-ember-44
spec:
  secretStoreRef:
    name: cloud-secrets
    kind: ClusterSecretStore
  target:
    name: payvendor-api
  data:
    - secretKey: api-key
      remoteRef:
        key: orderdesk/payvendor/api-key
---
apiVersion: external-secrets.io/v1beta1
