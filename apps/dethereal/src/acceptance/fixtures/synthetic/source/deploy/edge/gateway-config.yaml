apiVersion: v1
kind: ConfigMap
metadata:
  name: edge-gateway-config
  namespace: edge
data:
  kong.yml: |
    _format_version: "3.0"
    services:
      - name: orders-api
        url: http://orders-api.orders.svc.cluster.local:8080
        routes:
          - name: orders
            paths: ["/api/orders"]
          - name: checkout
            paths: ["/api/checkout"]
          - name: cart
            paths: ["/api/cart"]
        plugins:
          - name: rate-limiting
            config:
              minute: 120
              policy: local
          - name: request-size-limiting
            config:
              allowed_payload_size: 1
              size_unit: megabytes
    plugins:
      - name: correlation-id
      - name: http-log
        config:
          http_endpoint: https://ingest.logplatform.example/v1/edge
          headers:
            X-Ingest-Key: "{vault://env/log-ingest-key}"
