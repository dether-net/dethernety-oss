version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
    ignore:
      # Memgraph only supports @neo4j/graphql 7.2.0
      # https://memgraph.com/docs/client-libraries/graphql
      - dependency-name: "@neo4j/graphql"
      # @jsonforms/vue-vuetify peer-requires vuetify ^3.9.0 as of 3.7.0
      # (latest, Nov 2025) and 3.8.0-alpha.0 (next). Bumping vuetify to 4.x
      # breaks JSONForms-rendered UI. Lift when upstream ships Vuetify 4 support.
      - dependency-name: "vuetify"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 10

  # The operator console's SPA is a self-contained package with its OWN lockfile
  # (installed with --ignore-workspace), so the root "/" entry above does not see it.
  # Its tree is built in CI in a job that — until the build/sign split — held the signing
  # token, so keeping it patched matters. Track it explicitly.
  - package-ecosystem: "npm"
    directory: "/apps/byodt-console/ui"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "ci"
    commit-message:
      prefix: "ci"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "docker"
    commit-message:
      prefix: "docker"
