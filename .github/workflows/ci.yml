name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.13.2

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level=high
        continue-on-error: true

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm turbo build --filter='!mitre-frameworks'

      - name: Test
        run: pnpm turbo run test --filter='./apps/dt-ws'
        continue-on-error: true

  # The one package here that is published to npm, guarded on the two ways its release can
  # silently half-happen.
  #
  # Its own job, without `continue-on-error`, for the same reason as rego-parity below: the
  # `Test` step above is filtered to ./apps/dt-ws AND cannot fail the build, so a check placed
  # there would exist without running. Both failures below are invisible until someone installs
  # the plugin and gets something other than what this repository says they should.
  dethereal-release:
    name: Dethereal release integrity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The republish guard compares this ref against the base, so a shallow clone has
          # nothing to compare with.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.13.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The version is declared in three files. package.json is what npm publishes,
      # .claude-plugin/plugin.json is what the plugin reports, and .mcp.json pins the version
      # npx fetches — which makes it the one that decides what a user actually runs. Bumping
      # the package alone publishes a new version that no plugin install ever reaches.
      - name: Version declarations agree
        working-directory: apps/dethereal
        run: pnpm vitest run src/__tests__/mcp-config.test.ts

      # A published package's dependencies are resolved from the ranges the published copy
      # declares, not from this repository's lockfile — so a sweep that moves them without a
      # version bump leaves a repository that is fixed and a registry that is not.
      - name: Dependency changes are accompanied by a version bump
        working-directory: apps/dethereal
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "${BASE}" ] || [ "${BASE}" = "0000000000000000000000000000000000000000" ]; then
            echo "No base ref to compare against (first push on this ref) — skipping."
            exit 0
          fi
          node scripts/check-republish.mjs "${BASE}"

  # Differentially evaluates every policy in `modules/` through both the vendored
  # in-process Regorus WASM engine and the reference `opa` binary, and fails on any
  # disagreement. Security findings are produced by evaluating Rego, so the two engines
  # must agree exactly.
  #
  # Its own job, without `continue-on-error`: a divergence blocks the merge. The harness
  # treats a missing `opa` as a hard failure rather than skipping — a gate that loses its
  # oracle proves nothing.
  rego-parity:
    name: Rego parity (Regorus WASM vs OPA)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      OPA_VERSION: 1.18.2
      # Verified against the GitHub release asset and the openpolicyagent.org mirror.
      OPA_SHA256: 9903e5125ac281104f2c4b7371d10cc3b74a98933743fcbfc174f9bf0ab20de8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.13.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Pinned by content, not by tag: a swapped or truncated download fails here rather
      # than silently changing the oracle the whole gate is measured against.
      - name: Install OPA ${{ env.OPA_VERSION }} (checksum-pinned)
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 5 -o /usr/local/bin/opa \
            "https://github.com/open-policy-agent/opa/releases/download/v${OPA_VERSION}/opa_linux_amd64_static"
          echo "${OPA_SHA256}  /usr/local/bin/opa" | sha256sum -c -
          chmod +x /usr/local/bin/opa
          opa version

      # The floors are positive assertions. Without them, a corpus that failed to check
      # out would report "0 policies, 0 diffs" and pass.
      #
      # `raw` drives the WASM binding directly and needs no build. The `wrapper` mode, which
      # drives the compiled RegoEngine, would pull the whole workspace build graph into this
      # job for no extra signal about the blob — it runs in the monorepo's own pipeline.
      - name: Rego parity gate
        run: node packages/dt-module/test/rego-parity/run.mjs
        env:
          REGO_PARITY_ENGINE: raw
          REGO_PARITY_ROOTS: modules
          REGO_PARITY_OPA_VERSION: ${{ env.OPA_VERSION }}
          REGO_PARITY_MIN_MODERN_POLICIES: 75
          REGO_PARITY_MIN_MODERN_CASES: 300

      # Includes the package-time Rego lint's whole-corpus assertions over `modules/`
      # (0 errors, 0 warnings) and the builtin-partition drift guard against the blob.
      - name: dt-module unit tests
        run: pnpm --filter @dethernety/dt-module test

  # The packaging script runs on every module build and decides what a published
  # package contains: which files land in the payload, and the identity stamp that tells
  # one build of a module from another.
  #
  # Its own job, without `continue-on-error`, for the same reason as the two above: the
  # `Test` step in `build` is filtered to one app AND cannot fail the build, so a check
  # placed there would exist without running. The `Build` step does exercise the
  # packager for every module, so a crash is already caught — but a silent payload
  # regression is not, because nothing inspects what the packager produced.
  #
  # Stdlib-only, so no install step: `scripts/` resolves no dependencies, and keeping
  # it that way is what makes this job cheap enough to run on every push.
  #
  # The glob is shell-expanded rather than passed as a directory: a bare directory
  # argument is resolved as a module to execute, not as a set of tests to discover.
  packaging:
    name: Module packaging (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 5

    strategy:
      matrix:
        # package-module.js is ESM in a `.js` file with no `type` field anywhere above
        # it, so it depends on Node's module detection — which is exactly the thing
        # that differs across these majors.
        node-version: [20, 22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Packaging and module-hash unit tests
        run: node --test scripts/*.test.mjs

  # The Go module rooted here: the console binary and the shared packages it builds on
  # (payload digest, Cypher parsing, archive extraction, signature verification). Its own
  # job — the Node jobs above never build Go — pinned to the toolchain the module declares.
  go:
    name: Go (shared library + console)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # The console embeds a build-populated tree — the noauth schema, the data corpus, and
      # the built operator SPA — so it must be generated before anything compiles the module.
      # Node runs the dependency-free schema generator; pnpm builds the self-contained
      # --ignore-workspace SPA under ui/.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Populate console embed assets
        run: bash apps/byodt-console/build-assets.sh

      # build-assets.sh type-checks and bundles the SPA; run its unit suite too so a
      # runtime-assertion regression fails CI (the ui package is not a workspace member, so
      # turbo's test job never reaches it). Deps are already installed by the step above.
      - name: Test console SPA
        run: pnpm --dir apps/byodt-console/ui test

      - name: Verify dependencies
        run: go mod verify

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -count=1
