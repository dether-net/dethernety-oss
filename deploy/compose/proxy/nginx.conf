# Front door for the Dethernety stack — the single published entry point.
#
# Two properties matter here:
#   * It answers /healthz itself, so a front-door failure stays distinguishable
#     from a backend failure.
#   * It resolves the platform at REQUEST time. A literal `proxy_pass
#     http://platform:3003;` makes nginx resolve the upstream at startup and exit
#     with "host not found in upstream" whenever the platform is not up yet — so a
#     backend outage would present as no proxy at all. The resolver directive plus
#     a variable in proxy_pass defer resolution, turning that into a 502.
#
# TLS terminates HERE, at the edge, for the whole stack — the entrypoint
# (40-tls.sh) turns the markers below into an `ssl` listener when a certificate is
# present in the mounted tls/ dir, otherwise plain HTTP. Everything behind the front
# door stays plain HTTP on the isolated stack network; a loopback single-tenant
# deployment can run plain HTTP behind the operator's own boundary.

# Connection header for WebSocket/SSE upgrades. In the http context (conf.d is
# included there); empty when no Upgrade header is present.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# Internal, always-plain liveness listener for the container healthcheck. The
# published port below flips to HTTPS when a certificate is installed, so the
# healthcheck cannot rely on it; this port is never published.
server {
    listen 8081;
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}

server {
    # __TLS_LISTEN__ — the entrypoint renders this into `listen 80 [ssl] default_server;`.
    # __TLS_CERT__
    server_name _;

    # Don't cap upload/response size for large model payloads.
    client_max_body_size 50m;

    # The container DNS server, rendered by the entrypoint from /etc/resolv.conf so it
    # is correct on both Docker (127.0.0.11) and Podman (aardvark-dns, a per-network
    # address). Paired with the variable upstream below, this defers name resolution to
    # request time.
    resolver __RESOLVER__ valid=10s ipv6=off;

    # Self-contained liveness probe — does not depend on the upstream being up.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # The operator console, fronted under a subpath so it shares this origin — no second published
    # port, and the console's own sign-in callback lives on the same host as the platform's. The
    # console daemon serves its routes at the root (/, /api/, /assets/, /auth/callback); the rewrite
    # strips the /console prefix so those match, while the console SPA is built with base=/console/ so
    # the browser's URLs carry it. The rewrite is required because a variable proxy_pass does NOT
    # auto-strip the location prefix (and the variable + resolver keeps the front door starting even if
    # the console is momentarily unresolvable, exactly as the platform block below). The rewrite keeps
    # the query string, so the PKCE ?code&state survives the round trip.
    # absolute_redirect off: the proxy listens on :80 in-container but is published on a
    # different host port, so an absolute Location would drop that port. A relative Location
    # ("/console/") lets the browser resolve it against the real origin, port intact.
    location = /console {
        absolute_redirect off;
        return 308 /console/;
    }
    location /console/ {
        set $console_backend console:8080;
        rewrite ^/console/(.*)$ /$1 break;
        proxy_pass http://$console_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The console is not published on its own port, so every request reaches it through here — and
        # installing an entitled artifact is the one console request that can run for minutes: two
        # entitled fetches bounded at 60s each, plus a signature verification and an extraction.
        #
        # nginx's default read timeout is 60s, which is shorter than the daemon's own budget for that
        # handler (installWriteBudget, internal/daemoncmd/artifact.go). Without this the front door
        # would cut the answer off first and the operator would get a 504 where the daemon had a
        # sentence for them — including the case that matters most, an unreachable content service,
        # whose refusal is composed at t≈60s by construction.
        #
        # Deliberately LONGER than the daemon's budget rather than equal to it, so the daemon is always
        # the one that gives up first and the operator reads its refusal instead of a proxy error.
        proxy_read_timeout 240s;
    }

    # Everything else → the platform: the SPA, GraphQL, runtime /config, and the
    # SSE subscription/stream channel. The upstream is a variable so nginx keeps
    # the deferred-resolution behaviour described above.
    location / {
        set $platform_backend platform:3003;
        proxy_pass http://$platform_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket / SSE upgrade support.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # SSE: no buffering, long-lived connections for GraphQL subscriptions.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }
}
